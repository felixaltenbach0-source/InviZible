name: Build Native Libraries

on:
  workflow_dispatch:

jobs:
  build:
    name: Build libs (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            builder_arg: arm64
            tor_app_abi: arm64
            tor_platform: 21
            ndk_bit: 64
            i2pd_app_abi: arm64-v8a
            i2pd_platform: 21
            go_arch: arm64
            go_cc: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            builder_arg: ''
            tor_app_abi: armeabi-v7a
            tor_platform: 16
            ndk_bit: 32
            i2pd_app_abi: armeabi-v7a
            i2pd_platform: 16
            go_arch: arm
            go_cc: armv7a-linux-androideabi16-clang
          - abi: x86_64
            builder_arg: ''
            tor_app_abi: x86_64
            tor_platform: 21
            ndk_bit: 64
            i2pd_app_abi: x86_64
            i2pd_platform: 21
            go_arch: amd64
            go_cc: x86_64-linux-android21-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -qy install \
            autoconf autogen automake autopoint autotools-dev \
            gettext-base git libtool make patch pkg-config \
            ca-certificates curl gzip bzip2 libtinfo6 tar unzip wget \
            g++ rename python3 zip

      - name: Install Android NDK r23b
        run: |
          sudo mkdir -p /opt/android-sdk/ndk
          cd /tmp
          curl --silent -o android-ndk-r23b-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          echo "f47ec4c4badd11e9f593a8450180884a927c330d  android-ndk-r23b-linux.zip" > sha1.txt
          sha1sum -c sha1.txt
          unzip -q android-ndk-r23b-linux.zip
          sudo mv android-ndk-r23b /opt/android-sdk/ndk/23.1.7779620
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/23.1.7779620" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone component sources
        working-directory: tordnscrypt/libs
        run: |
          chmod +x prebuild build
          ./prebuild

      - name: Build all modules for ${{ matrix.abi }}
        working-directory: tordnscrypt/libs
        run: |
          if [ "${{ matrix.abi }}" = "arm64-v8a" ] || [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            ./build ${{ matrix.builder_arg }}
          else
            bash "$GITHUB_WORKSPACE/.github/ci/build-x86_64.sh"
          fi

      - name: List built libraries
        run: |
          echo "=== ${{ matrix.abi }} ==="
          ls -la tordnscrypt/libs/${{ matrix.abi }}/*.so

      - name: Upload ${{ matrix.abi }} libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.abi }}
          path: tordnscrypt/libs/${{ matrix.abi }}/*.so
          if-no-files-found: error
          retention-days: 30
