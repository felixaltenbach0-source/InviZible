name: Build Vanguards Binaries

# Cross-compiles vanguards (Python) to a standalone Android binary using
# Nuitka + the Android NDK clang cross-compiler.  The same NDK r23b toolchain
# used for tor/dnscrypt/i2pd is reused here via CC/LD/AR/RANLIB env vars.
#
# No QEMU or Docker containers are needed — compilation runs natively on the
# GitHub Actions x86_64 host while the NDK clang emits ARM/x86_64 Android code.
#
# The build is best-effort: if an ABI fails, this workflow still succeeds and
# simply omits that artifact, so the caller falls back to the checked-in
# vanguards.bin (arm64-only).  As a reusable workflow it must never fail the
# release job.

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref of vanguards submodule to build'
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            ndk_cc: aarch64-linux-android21-clang
            ndk_cxx: aarch64-linux-android21-clang++
            ndk_target: aarch64-linux-android
            ndk_api: '21'
          - abi: armv7a
            ndk_cc: armv7a-linux-androideabi16-clang
            ndk_cxx: armv7a-linux-androideabi16-clang++
            ndk_target: armv7a-linux-androideabi
            ndk_api: '16'
          - abi: x86_64
            ndk_cc: x86_64-linux-android21-clang
            ndk_cxx: x86_64-linux-android21-clang++
            ndk_target: x86_64-linux-android
            ndk_api: '21'

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout vanguards submodule
        uses: actions/checkout@v4
        with:
          repository: felixaltenbach0-source/vanguards
          ref: ${{ inputs.ref || 'master' }}
          path: vanguards

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python build dependencies
        run: pip install --upgrade pip nuitka ordered-set zstandard stem==1.8.0

      - name: Install Android NDK r23b
        run: |
          sudo mkdir -p /opt/android-sdk/ndk
          cd /tmp
          curl --silent -o android-ndk-r23b-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          echo "f47ec4c4badd11e9f593a8450180884a927c330d  android-ndk-r23b-linux.zip" > sha1.txt
          sha1sum -c sha1.txt
          unzip -q android-ndk-r23b-linux.zip
          sudo mv android-ndk-r23b /opt/android-sdk/ndk/23.1.7779620

      - name: Build vanguards with NDK cross-compiler for ${{ matrix.abi }}
        continue-on-error: true
        run: |
          NDK=/opt/android-sdk/ndk/23.1.7779620
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64

          export CC="$TOOLCHAIN/bin/${{ matrix.ndk_cc }}"
          export CXX="$TOOLCHAIN/bin/${{ matrix.ndk_cxx }}"
          export LD="$TOOLCHAIN/bin/${{ matrix.ndk_cc }}"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          export CCFLAGS="--target=${{ matrix.ndk_target }}${{ matrix.ndk_api }} -fPIC"
          export LDFLAGS="--target=${{ matrix.ndk_target }}${{ matrix.ndk_api }} -static-libstdc++ -llog"

          echo "CC=$CC"
          echo "LD=$LD"
          echo "AR=$AR"
          $CC --version

          mkdir -p out
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --include-package=stem \
            --include-package=vanguards \
            --output-filename="$(pwd)/out/vanguards-${{ matrix.abi }}.bin" \
            "$(pwd)/vanguards/src/vanguards.py"

      - name: Verify binary
        run: |
          if [ -f "out/vanguards-${{ matrix.abi }}.bin" ]; then
            file "out/vanguards-${{ matrix.abi }}.bin"
            ls -lh "out/vanguards-${{ matrix.abi }}.bin"
          else
            echo "::warning::No binary produced"
          fi

      - name: Stage binaries for APK packaging
        run: |
          mkdir -p staged
          if [ -f "out/vanguards-${{ matrix.abi }}.bin" ]; then
            cp "out/vanguards-${{ matrix.abi }}.bin" "staged/vanguards-${{ matrix.abi }}.bin"
            echo "${{ matrix.abi }} vanguards built fresh by NDK cross-compile"
          else
            echo "::warning::${{ matrix.abi }} Nuitka build did not produce a binary"
          fi
          ls -la staged/ 2>/dev/null || true

      - name: Upload ${{ matrix.abi }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: vanguards-${{ matrix.abi }}
          path: staged/
          if-no-files-found: ignore
