name: Build Vanguards Binaries

# Reusable workflow: builds a statically-linked, standalone vanguards binary
# (compiled with Nuitka) for the arm64 (aarch64) ABI using an arm64 Python
# container emulated via QEMU binfmt. Nuitka needs to execute the target
# interpreter, so the build runs inside an ARM container.
#
# NOTE: Only arm64 is built here. The armv7a (32-bit ARM) vanguards is not
# available: Docker Hub has discontinued linux/arm/v7 manifests for the
# official python base image, and the checked-in vanguards.bin is arm64-only,
# so the armv7a APK never bundles vanguards (see build-release.yml).
#
# The Nuitka build is best-effort: if it fails, this workflow still succeeds
# and reports binaries-ready=false so the caller falls back to the checked-in
# arm64 vanguards.bin. As a reusable workflow it must not fail the release job.

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref of vanguards submodule to build'
        required: false
        type: string
        default: ''
    outputs:
      binaries-ready:
        description: 'Whether the arm64 vanguards binary was produced'
        value: ${{ jobs.build.outputs.binaries-ready }}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      binaries-ready: ${{ steps.stage.outputs.binaries-ready }}

    steps:
      - name: Checkout vanguards submodule
        uses: actions/checkout@v4
        with:
          repository: felixaltenbach0-source/vanguards
          ref: ${{ inputs.ref || 'master' }}
          path: vanguards

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vanguards with Nuitka for arm64
        continue-on-error: true
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD/vanguards:/build/vanguards" \
            -v "$PWD/out:/build/out" \
            arm64v8/python:3.9-slim /bin/sh -c '
              set -e
              pip install --upgrade pip nuitka stem==1.8.0
              cd /build/vanguards
              python -m nuitka \
                --standalone \
                --onefile \
                --assume-yes-for-downloads \
                --include-package=stem \
                --include-package=vanguards \
                --output-filename=/build/out/vanguards-arm64.bin \
                src/vanguards.py
            '

      - name: Stage binaries for APK packaging
        id: stage
        run: |
          mkdir -p staged
          if [ -f out/vanguards-arm64.bin ]; then
            cp out/vanguards-arm64.bin staged/vanguards-arm64.bin
            echo "binaries-ready=true" >> "$GITHUB_OUTPUT"
            echo "arm64 vanguards built fresh by Nuitka"
          else
            echo "binaries-ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nuitka arm64 build did not produce a binary; build-release.yml will fall back to the checked-in vanguards.bin."
          fi
          ls -la staged/ 2>/dev/null || true

      - name: Upload staged binaries
        uses: actions/upload-artifact@v4
        with:
          name: vanguards-binaries
          path: staged/
          if-no-files-found: ignore
