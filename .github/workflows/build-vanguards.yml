name: Build Vanguards Binaries

# Reusable workflow: builds a statically-linked, standalone vanguards binary
# (compiled with Nuitka) for the ARM ABIs. The executable is packaged as
# libvanguards.so and launched by the app as a subprocess (see
# ModulesStarterHelper#getVanguardsStarterRunnable), so Nuitka must run on the
# target architecture (there is no turnkey host-side Android cross-compile).
# Each ABI is built inside a matching target-arch container via QEMU binfmt.
#
# ARM64:  official arm64v8/python image (proven).
# ARMv7a: arm32v7/debian + python3 from apt, because Docker Hub has dropped the
#         linux/arm/v7 manifest for the official python base images.
#
# The build is best-effort: if an ABI fails, this workflow still succeeds and
# simply omits that artifact, so the caller falls back to the checked-in
# vanguards.bin (arm64-only). As a reusable workflow it must never fail the
# release job.

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref of vanguards submodule to build'
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            container: arm64v8/python:3.9-slim
            platform: linux/arm64
            output: vanguards-arm64.bin
            setup: |
              apt-get update
              apt-get install -y --no-install-recommends gcc
              pip install --upgrade pip nuitka stem==1.8.0
            pybin: python
          - abi: armv7a
            container: arm32v7/debian:bookworm-slim
            platform: linux/arm/v7
            output: vanguards-armv7a.bin
            setup: |
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv gcc
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install --upgrade pip nuitka stem==1.8.0
            pybin: /opt/venv/bin/python

    steps:
      - name: Checkout vanguards submodule
        uses: actions/checkout@v4
        with:
          repository: felixaltenbach0-source/vanguards
          ref: ${{ inputs.ref || 'master' }}
          path: vanguards

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vanguards with Nuitka for ${{ matrix.abi }}
        continue-on-error: true
        run: |
          mkdir -p out
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/vanguards:/build/vanguards" \
            -v "$PWD/out:/build/out" \
            ${{ matrix.container }} /bin/sh -c '
              set -e
              '"${{ matrix.setup }}"'
              ${{ matrix.pybin }} -m nuitka \
                --standalone \
                --onefile \
                --assume-yes-for-downloads \
                --include-package=stem \
                --include-package=vanguards \
                --output-filename=/build/out/${{ matrix.output }} \
                /build/vanguards/src/vanguards.py
            '

      - name: Stage binaries for APK packaging
        id: stage
        run: |
          mkdir -p staged
          if [ -f "out/${{ matrix.output }}" ]; then
            cp "out/${{ matrix.output }}" "staged/${{ matrix.output }}"
            echo "${{ matrix.abi }} vanguards built fresh by Nuitka"
          else
            echo "::warning::${{ matrix.abi }} Nuitka build did not produce a binary"
          fi
          ls -la staged/ 2>/dev/null || true

      - name: Upload ${{ matrix.abi }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: vanguards-${{ matrix.abi }}
          path: staged/
          if-no-files-found: ignore
