name: Build and Release APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK build tools
        run: sdkmanager "build-tools;36.0.0" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal APK
        run: ./gradlew assembleFdroidUniversalRelease --no-daemon --stacktrace

      - name: Build ARM64 APK
        run: ./gradlew assembleFdroidArm64Release --no-daemon --stacktrace

      - name: Build ARMv7a APK
        run: ./gradlew assembleFdroidArmv7aRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find tordnscrypt/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          ls -la apk-output/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invizible-apks
          path: apk-output/*.apk
          retention-days: 30

      - name: Extract version from build.gradle
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"([^"]+)"' tordnscrypt/build.gradle | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "InviZible ${{ steps.version.outputs.version }}"
          files: apk-output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
