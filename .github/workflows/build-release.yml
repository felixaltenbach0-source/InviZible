name: Build and Release APK

on:
  push:
    branches:
      - master
      - stable

jobs:
  vanguards-build:
    uses: ./.github/workflows/build-vanguards.yml
    with:
      ref: ''

  native-libs-build:
    uses: ./.github/workflows/build-native-libs.yml

  build:
    runs-on: ubuntu-latest
    needs: [vanguards-build, native-libs-build]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK build tools & platform
        run: |
          # Ensure the exact build-tools/platform the app requires are present.
          # The compileSdk 37 platform is auto-downloaded by AGP if absent, so we
          # don't pin it here (sdkmanager reports it as a missing package).
          sdkmanager \
            "build-tools;36.0.0" \
            "platforms;android-36"

      - name: Install Android NDK r23b
        run: |
          # The app pins ndkVersion '23.1.7779620'. Install it directly (same
          # method used by the native-libs/vanguards jobs) so it is guaranteed
          # present and used by default for the CMake/JNI build.
          ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/23.1.7779620"
          if [ -d "$ANDROID_NDK_HOME" ]; then
            echo "NDK 23.1.7779620 already present at $ANDROID_NDK_HOME"
            exit 0
          fi
          sudo mkdir -p "$(dirname "$ANDROID_NDK_HOME")"
          cd /tmp
          curl --silent -o android-ndk-r23b-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          echo "f47ec4c4badd11e9f593a8450180884a927c330d  android-ndk-r23b-linux.zip" > sha1.txt
          sha1sum -c sha1.txt
          unzip -q android-ndk-r23b-linux.zip
          sudo mv android-ndk-r23b "$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "Installed Android NDK r23b to $ANDROID_NDK_HOME"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download freshly built vanguards binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vanguards-*
          path: vanguards-built
          merge-multiple: true
          if-no-files-found: ignore

      - name: Copy vanguards binaries to JNI libs
        run: |
          mkdir -p tordnscrypt/libs/arm64-v8a tordnscrypt/libs/armeabi-v7a

          # Prefer freshly Nuitka-built binaries, fall back to checked-in vanguards.bin.
          if [ -f vanguards-built/vanguards-arm64.bin ]; then
            cp vanguards-built/vanguards-arm64.bin tordnscrypt/libs/arm64-v8a/libvanguards.so
            echo "Using freshly built arm64 vanguards"
          elif [ -f vanguards.bin ]; then
            cp vanguards.bin tordnscrypt/libs/arm64-v8a/libvanguards.so
            echo "Using checked-in arm64 vanguards.bin"
          fi

          if [ -f vanguards-built/vanguards-armv7a.bin ]; then
            cp vanguards-built/vanguards-armv7a.bin tordnscrypt/libs/armeabi-v7a/libvanguards.so
            echo "Using freshly built armv7a vanguards"
          else
            echo "No armv7a vanguards binary available"
          fi

          if [ -f vanguards-built/vanguards-x86_64.bin ]; then
            mkdir -p tordnscrypt/libs/x86_64
            cp vanguards-built/vanguards-x86_64.bin tordnscrypt/libs/x86_64/libvanguards.so
            echo "Using freshly built x86_64 vanguards"
          fi

          if [ -f tordnscrypt/libs/arm64-v8a/libvanguards.so ] || [ -f tordnscrypt/libs/armeabi-v7a/libvanguards.so ]; then
            chmod +x tordnscrypt/libs/arm64-v8a/libvanguards.so 2>/dev/null || true
            chmod +x tordnscrypt/libs/armeabi-v7a/libvanguards.so 2>/dev/null || true
            echo "Vanguards binaries staged for packaging:"
            ls -la tordnscrypt/libs/arm64-v8a/libvanguards.so 2>/dev/null || true
            ls -la tordnscrypt/libs/armeabi-v7a/libvanguards.so 2>/dev/null || true
          else
            echo "::warning::No vanguards binary available — vanguards module will not be included"
          fi

      - name: Download freshly built native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-libs-*
          path: native-libs
          merge-multiple: true

      - name: Stage native libraries into JNI libs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "tordnscrypt/libs/$abi"
            if ls native-libs/$abi/*.so >/dev/null 2>&1; then
              cp native-libs/$abi/*.so "tordnscrypt/libs/$abi/"
              echo "Using freshly built native libs for $abi:"
              ls -la "tordnscrypt/libs/$abi/" | head -20
            else
              echo "::warning::No fresh native libs for $abi; keeping checked-in binaries"
            fi
          done
          echo "=== Final JNI lib layout ==="
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "--- $abi ---"
            ls tordnscrypt/libs/$abi/ 2>/dev/null || true
          done

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Generate a brand-new keystore from the secret passwords/alias so the
          # APKs can always be signed regardless of any pre-existing keystore.
          # This avoids the "bad key / not properly padded" errors that occurred
          # when the stored KEYSTORE_BASE64 did not match the passwords.
          #
          # Note: JDK 17 keytool creates a PKCS12 keystore by default, which
          # does NOT support differing store/key passwords (it ignores -keypass
          # and locks the key to the store password). So we use ONE password for
          # both the store and the key, and pass the same value to Gradle.
          STORE_PASS="${KEYSTORE_PASSWORD:-changeit}"
          ALIAS="${KEY_ALIAS:-invizible}"
          if [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "::warning::Keystore secrets not configured; generating a throwaway signing keystore."
          fi

          mkdir -p .keystore

          keytool -genkeypair \
            -v \
            -keystore .keystore/release.jks \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=InviZible CI, OU=InviZible, O=InviZible, C=US"

          chmod 600 .keystore/release.jks

          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/.keystore/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "Release signing keystore generated from GitHub secrets."

      - name: Build Universal APK
        run: ./gradlew assembleFdroidUniversalRelease --no-daemon --stacktrace

      - name: Build ARM64 APK
        run: ./gradlew assembleFdroidArm64Release --no-daemon --stacktrace

      - name: Build ARMv7a APK
        run: ./gradlew assembleFdroidArmv7aRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find tordnscrypt/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          echo "=== Built APKs ==="
          ls -la apk-output/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invizible-apks
          path: apk-output/*.apk
          retention-days: 30

      - name: Extract version from build.gradle
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"([^"]+)"' tordnscrypt/build.gradle | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Auto-tag release
        id: auto-tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          # Give every commit its own individual, immutable tag/release so
          # builds are never collapsed into a single overwritten release.
          TAG="v${VERSION}-stable-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping re-tag to keep it immutable."
            GH_TOKEN="${{ github.token }}" gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
              exit 1
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Tagged release: $TAG"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.auto-tag.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it immutable. Not overwriting."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "InviZible $VERSION ($SHORT_SHA)" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            apk-output/*.apk
          echo "Published release: $TAG"
